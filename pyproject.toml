[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paraquake"
version = "0.1.0"
description = "Parametric earthquake NatCat trigger engine with a LangGraph agent pipeline and Streamlit demo UI"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
